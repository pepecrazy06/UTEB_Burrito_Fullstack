spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=uteb;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
uteb.demo=false
uteb.seed=${SEED_ENABLED:false}
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
