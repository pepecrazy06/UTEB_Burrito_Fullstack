spring.application.name=UTEB Burrito
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:demo}
spring.jpa.open-in-view=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${MAIL_USERNAME:${SMTP_USER:}}
spring.mail.password=${MAIL_PASSWORD:${SMTP_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
uteb.mail.enabled=${MAIL_ENABLED:false}
uteb.mail.from=${MAIL_FROM:${FROM_EMAIL:noreply@uteb.local}}
uteb.base-url=${BASE_URL:http://localhost:8080}
uteb.jwt-secret=${JWT_SECRET:}
uteb.cloudinary.cloud=${CLOUDINARY_CLOUD:}
uteb.cloudinary.key=${CLOUDINARY_KEY:}
uteb.cloudinary.secret=${CLOUDINARY_SECRET:}
uteb.vnpay.code=${VNPAY_TMN_CODE:}
uteb.vnpay.secret=${VNPAY_HASH_SECRET:}
uteb.momo.partner=${MOMO_PARTNER_CODE:}
uteb.momo.access=${MOMO_ACCESS_KEY:}
uteb.momo.secret=${MOMO_SECRET_KEY:}
